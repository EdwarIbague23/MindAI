[alembic]
# Configuración básica de Alembic para PostgreSQL v16
# Se completará completamente en la Fase 3 con el modelo ERD V2

# Configuración del script
script_path = alembic/scripts
env_module = mindflow_ia.core.config.environments.dev

# Configuración de la base de datos
# NOTE: En Fase 1 usamos una URL simulada; se actualizará en Fase 3
sqlalchemy.url = postgresql+psycopg2://mindflow_user:mindflow_pass@localhost:5432/mindflow_ai_fase1

# Configuración de logging
logger_name = alembic

# Configuración de metadata para autodetection
# Se completará con modelos SQLAlchemy en Fase 3
metadata_path = mi_framework_ia.models

# Configuración de versión
default_schema = None
include_schema = false